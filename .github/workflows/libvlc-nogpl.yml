name: LibVLC without GPL

# Builds LibVLC for Windows without GPL code, for both architectures, and refuses the
# result unless eng/libvlc/verify-nogpl.ps1 finds nothing GPL in it.
#
# A workflow of its own and not a step of ci.yml, for two measured reasons. The engine is built once
# per VLC version, not per commit: its inputs are the tag, the patches and these scripts, and
# nothing in src/ changes them. And ci.yml's single Windows job already runs close enough to its
# ceiling that its margin is watched; hours of contrib builds do not belong inside it.
#
# It runs where VideoLAN runs it: their CI images, named in extras/ci/gitlab-ci.yml at the tag.
# The dates in the image tags are theirs and are pinned on purpose — a newer image is a newer
# toolchain, and that is a change to review, not to receive.

on:
  workflow_dispatch:
    inputs:
      # The Dolby Digital switch, decided on 2026-10-30: Dolby Digital stays in unless a build is
      # launched by hand with it off. A push builds with it on, because a push has no inputs.
      dolby_digital:
        description: Dolby Digital (AC-3, E-AC-3) decoders in the engine
        type: choice
        options:
          - "on"
          - "off"
        default: "on"
  push:
    branches:
      - dev
      - dev/**
    paths:
      - eng/libvlc/**
      - .github/workflows/libvlc-nogpl.yml

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    # The contribs are the bulk. Measure the run rather than trust this number; it is a hang
    # ceiling, not an estimate. Hosted jobs stop at 360.
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            image: registry.videolan.org/vlc-debian-win64-3.0:20251208092116
          - arch: aarch64
            image: registry.videolan.org/vlc-debian-llvm-ucrt:20250903131032
    container:
      image: ${{ matrix.image }}
      # The images default to an unprivileged user that cannot write the workspace GitHub mounts.
      options: --user 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Measured on 2026-10-06 (run 37449793289): the runner starts with 5.8 GB free of 72,
      # the build tree takes about 5 GB, and aarch64 finished with 623 MB to spare. The host's tool
      # cache (Python, Go, Node, CodeQL…) is mounted here as /__t and nothing in this job uses it —
      # checkout and the uploads run from the runner's own externals — so it goes, measured both sides.
      - name: Free the host's tool cache
        run: |
          df -h "$GITHUB_WORKSPACE"
          du -xsh /__t/* || true
          rm -rf /__t/*
          df -h "$GITHUB_WORKSPACE"

      # The x86_64 build ran out of disk on 2026-10-05, 38 minutes in and in the middle of the
      # contribs, with the same scripts that passed on 2026-09-27. Before freeing anything, measure:
      # the free space every minute while it builds, and what the tree holds when it ends, pass or not.
      # The switch's battery, here because this image is where the switch runs: seconds, before hours.
      - name: Test the Dolby Digital switch
        run: sh eng/libvlc/dolby-digital-switch.test.sh

      - name: Build
        env:
          DOLBY_DIGITAL: ${{ inputs.dolby_digital || 'on' }}
        run: |
          git config --global --add safe.directory '*'
          df -h / "$GITHUB_WORKSPACE"
          ( while sleep 60; do echo "disk $(date -u +%H:%M) $(df -h --output=avail,pcent "$GITHUB_WORKSPACE" | tail -n 1)"; done ) &
          sampler=$!
          status=0
          sh eng/libvlc/build-nogpl.sh "${{ matrix.arch }}" "$GITHUB_WORKSPACE/out" || status=$?
          kill "$sampler"
          exit "$status"

      - name: Disk after the build
        if: always()
        run: |
          df -h / "$GITHUB_WORKSPACE"
          du -xsh "$GITHUB_WORKSPACE/out"/* || true
          du -xh --max-depth=2 "$GITHUB_WORKSPACE/out/vlc-src" | sort -rh | head -n 20 || true
          du -xh --max-depth=1 "$GITHUB_WORKSPACE"/out/vlc-src/contrib/contrib-* | sort -rh | head -n 25 || true

      # The verify job needs the tree the plugins were built from, to read their licences, and the
      # Makefile contrib/bootstrap generated, to see that GPL was off. Not the multi-gigabyte
      # contrib build itself.
      - name: Pack what the verification reads
        run: |
          cd "$GITHUB_WORKSPACE/out"
          tar -czf libvlc-build.tar.gz install \
            vlc-src/.git vlc-src/modules vlc-src/include vlc-src/src vlc-src/lib vlc-src/configure.ac \
            vlc-src/contrib/contrib-*/Makefile

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libvlc-build-${{ matrix.arch }}
          path: out/libvlc-build.tar.gz
          retention-days: 7

      # The corresponding source of every third-party library linked into the tree (FFmpeg and the
      # rest, LGPL): the exact tarballs this build fetched, each already checked by contrib's own
      # SHA512SUMS. libvlc-publish.yml attaches them to the release beside the binaries, so they
      # must outlive the build: 30 days, like the tree they belong to.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libvlc-source-${{ matrix.arch }}
          path: out/vlc-src/contrib/tarballs
          if-no-files-found: error
          retention-days: 30

  verify:
    name: verify ${{ matrix.arch }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            nuget: x64
          - arch: aarch64
            nuget: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libvlc-build-${{ matrix.arch }}

      # The reference is the package the application ships today, which is built as GPL: it is what
      # every check in verify-nogpl.ps1 uses to prove it can see. fetch-reference.ps1 accepts it
      # only by its pinned SHA-512, and only while the lock file still names that version.
      - name: Fetch the reference package
        shell: pwsh
        run: |
          pwsh -NoProfile -File eng/libvlc/fetch-reference.ps1 -Destination ref

      - name: Verify
        shell: pwsh
        run: |
          tar -xzf libvlc-build.tar.gz
          pwsh -NoProfile -File eng/libvlc/verify-nogpl.ps1 -Install install -VlcSource vlc-src `
            -Reference "ref/build/${{ matrix.nuget }}" -Destination "libvlc-nogpl-${{ matrix.nuget }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: libvlc-nogpl-${{ matrix.nuget }}
          path: libvlc-nogpl-${{ matrix.nuget }}
          retention-days: 30

  # A tree with no GPL in it is only half the claim; the other half is that it still plays what the
  # application promises. Four of the libraries the build drops decoded promised formats (AC-3,
  # DTS, AAC, MP3), so this plays one sample per codec through the rebuilt tree on the architecture
  # it was built for, and through VideoLAN's reference tree beside it: a row that fails on both is
  # a broken sample, one that fails only on ours is a finding.
  decode:
    name: decode ${{ matrix.nuget }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - nuget: x64
            runner: windows-2025
          - nuget: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libvlc-nogpl-${{ matrix.nuget }}
          path: libvlc-nogpl

      # ffmpeg-full for the reason written over ci.yml's step: the plain package lacks the
      # encoders the samples need. It only PRODUCES the samples; it is not the code under test.
      - name: Install ffmpeg
        shell: pwsh
        run: |
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { 'ffmpeg is already present.'; exit 0 }
          foreach ($attempt in 1..3) {
            choco install ffmpeg-full --version 9.0.0 -y --no-progress
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 20
          }
          throw 'ffmpeg could not be installed after three attempts.'

      - name: Fetch the reference package
        shell: pwsh
        run: |
          pwsh -NoProfile -File eng/libvlc/fetch-reference.ps1 -Destination ref

      - name: Decode through the reference
        shell: pwsh
        run: |
          $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          pwsh -NoProfile -File eng/libvlc/decode-probe.ps1 -LibVlc "ref/build/${{ matrix.nuget }}" -Samples samples

      # And who decodes H.264, HEVC and AAC: never FFmpeg, and Windows where it can. The
      # Server image's toolset does not install Media Foundation (and installing it needs a
      # restart), so probably only the ARM64 runner, a Windows 11 client, sees Windows decode them;
      # the probe asks each machine what it has before it asserts, and says what it found.
      - name: Decode through the rebuilt tree
        shell: pwsh
        run: |
          $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          pwsh -NoProfile -File eng/libvlc/decode-probe.ps1 -LibVlc libvlc-nogpl -Samples samples -PatentedThroughWindows `
            -DolbyDigital "${{ inputs.dolby_digital || 'on' }}"
