name: CI

on:
  # Working branches only, and main deliberately absent. Main is kept by fast-forward from the branch
  # with `git push origin codex/...:main`, so every commit it receives has already run here under the
  # same SHA — and a check belongs to a commit rather than to a ref, so main shows the result it
  # already earned. Until 2026-08-18 both were listed and every change verified itself twice over an
  # identical tree, which on a 36-to-64-minute job is half the work for no second opinion.
  #
  # What this gives up: a commit that reached main without passing through a branch would go
  # unverified. That does not happen today, and it announces itself — the commit would carry no check
  # at all. Anything arriving from outside still comes through pull_request below.
  push:
    branches:
      - codex/**
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  verify:
    # Hosted runners only. The private era once routed verification to a self-hosted runner via a
    # repository variable; on a public repository that mechanism is a standing invitation for fork
    # pull requests to execute on a personal machine the moment the variable reappears, so the
    # workflow no longer consults it. Hosted minutes are free on public repositories.
    runs-on: windows-2025
    # The verification seals the package and builds the payload twice more to compare them, and the
    # walk now presses all 128 command controls with real video behind them. Measured on 2026-08-18
    # with one commit that ran on two runners: 36 minutes on one and over 60 on the other, with no
    # gap anywhere in the log — the steps chained, the work was simply slower. A ceiling that cuts
    # healthy runs at random does not catch hangs, it teaches people to ignore reds, so it moves to
    # 90: a hang still dies, thirty minutes later, and a healthy job has room on a bad runner.
    #
    # The old rule of thumb went with it. "Cancelled at 60 minutes is a hang" is no longer true;
    # cancelled at 90 is. And the number to watch is the healthy job: it was 36-64 minutes here, so
    # a healthy run approaching 90 means the work has grown again and this deserves another look
    # rather than another raise.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Two clean checkouts are made from this history to compare the payload against itself.
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      # The runner image used to ship ffmpeg and stopped; without it no media sample is generated,
      # the codec matrix and the segment corpus go unmeasured, and the package lifecycle cannot
      # exercise the file association. Installing it keeps those gates real in CI.
      # A machine that already carries ffmpeg is left untouched; the system-wide install only
      # happens on hosted images, which arrive without it. The version is pinned so a floating
      # community tag cannot change what runs here between one build and the next.
      # The community feed answers 503 often enough to have cost two runs on 2026-08-24 alone, and a
      # build that never compiled is not a verdict about the code. Three attempts with a widening
      # wait; the version stays pinned, so what a retry can change is the transport and nothing else.
      - name: Install ffmpeg
        shell: pwsh
        run: |
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { 'ffmpeg is already present.'; exit 0 }
          foreach ($attempt in 1..3) {
            choco install ffmpeg --version 9.0.0 -y --no-progress
            if ($LASTEXITCODE -eq 0) { exit 0 }
            "Attempt $attempt failed ($LASTEXITCODE); the community feed is the usual reason."
            if ($attempt -lt 3) { Start-Sleep -Seconds (20 * $attempt) }
          }
          throw 'ffmpeg could not be installed after three attempts.'
      # This builds and seals both architectures. The separate ARM64 restore check that used to live
      # below was weaker than what replaced it: a restore resolves packages without ever compiling,
      # which is why `-r win-arm64` passed here for months while the build itself failed outright.
      # -NonBlockingPerformance: the budgets run and their verdict is archived with the test
      # results, but a shared runner's noise cannot fail the build (CI-003/CI-005). They stay
      # blocking on the physical harness, which is where they mean something.
      # Every gate below carries its own ceiling, and their only job is to name which step hung.
      # The job's 90 minutes were already there and can only say the whole job died. The numbers are
      # what these steps measured on 2026-08-20 with room on top: 39m26s here, 13m20s for
      # accessibility, 2m09s for recovery, 3m00s-4m16s for the walk. A step that reaches its ceiling
      # is a hang worth reading, not a slow runner - which is the distinction that cost six runs to
      # learn the first time.
      # THE ACCESSIBILITY SUITE STAYS IN THIS PASS, and the attempt to take it out is why that is
      # written down rather than assumed. On 2026-09-03 it was moved to its gate alone — 8.8 minutes
      # of a 79-minute job, apparently free because the gate runs the same suite twice right after.
      # It was not free. That suite mounts the whole application and walks every view, so it is the
      # only thing covering swathes of Presentation IN THIS PASS, which is the pass the coverage gate
      # measures. Removing it dropped half a dozen files at once — ScanSettingsViewModel from 81/50
      # to 18/0 — and the gate refused, correctly: coverage does not go backwards.
      #
      # The saving is real and still available, but it costs collecting coverage from the gate too
      # and merging it here; that is a change to the gate's own script rather than a switch, and it
      # is not worth doing blind at the end of a batch. What stays is the walk's, below, which costs
      # nothing because the walk's counter never contributed coverage in the first place.
      - name: Verify both architectures
        timeout-minutes: 70
        shell: pwsh
        run: ./eng/verify.ps1 -Configuration Release -Runtime win-x64 -NonBlockingPerformance
      # The two audit gates used to be manual-only (CI-001/CI-002): the accessibility journey and
      # the recovery matrix could regress and CI would stay green. Verify mode fails on any
      # critical or major finding, and each gate has to pass twice in a row to be called clean.
      - name: Accessibility gate
        timeout-minutes: 35
        shell: pwsh
        run: ./eng/run-accessibility.ps1 -Mode Verify -Passes 2
      - name: Recovery gate
        timeout-minutes: 15
        shell: pwsh
        run: ./eng/run-recovery.ps1 -Mode Verify -Passes 2
      # What the autonomous walk pressed with a real mouse, against what the views declare. The
      # pending list may only shrink, so an area that regresses to keyboard-only work fails here
      # rather than at the next redesign.
      # -SkipRun: the accessibility gate above has already walked, twice, and the walk writes its
      # ledger to artifacts/walk on every press whether or not anything asked it to — so the report
      # this reads is the one that gate just produced. Walking a fourth time to count what the third
      # walk pressed cost about four minutes a run.
      #
      # It therefore DEPENDS ON THE STEP ABOVE HAVING RUN. Without it there is no report and this
      # fails saying so, which is the right failure: a stale count would be worse than none.
      - name: Walk coverage gate
        timeout-minutes: 15
        shell: pwsh
        run: ./eng/check-walk-coverage.ps1 -SkipRun
      # The debt floors belong to the environment that measures them, and that is this one: the
      # runner has no audio device and its clocks are not a developer's, so seven files read
      # differently here — WindowsAudioDeviceCatalog.cs holds 79/61 on the machine that wrote the
      # list and reads 32/11 here. Every build writes the list it would hold itself and publishes
      # it, pass or fail, so moving a floor is copying this run's measurement rather than guessing
      # at one. It runs after the gates so a failing verify still leaves the numbers behind.
      - name: Emit the coverage debt this run measured
        if: always()
        continue-on-error: true
        shell: pwsh
        run: ./eng/check-coverage.ps1 -ResultsDirectory artifacts/test-results/verify-win-x64 -WriteDebt
      - name: Upload the coverage debt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-debt
          path: eng/coverage-debt.txt
          if-no-files-found: warn
      - name: Upload audit gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-gates
          path: |
            artifacts/accessibility
            artifacts/recovery
            artifacts/walk
          if-no-files-found: warn
      - name: Upload the ARM64 matrix
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arm64-matrix
          path: |
            artifacts/package-arm64/contents.json
            artifacts/package-arm64/arm64-matrix.json
            artifacts/package-arm64/SHA256SUMS.txt
          if-no-files-found: warn
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: warn

  # PRD-003. The ARM64 matrix has six phases and all six have always read "this build ran on a X64
  # host", because the branch that runs them only runs when the host is ARM64 and there was no such
  # machine. There is one now and it costs nothing: GitHub's `windows-11-arm` hosted runners are free
  # and unlimited on public repositories, and this one has been public since 2026-08-10.
  #
  # The image is built and maintained by Arm Limited and is NOT the x64 image. It carries Chocolatey,
  # Visual Studio 2022, the 10.0.22621.0 Windows SDK this project targets, and .NET 10.0.101 - which
  # is a different feature band from the 10.0.302 global.json pins, so the SDK is installed here as
  # it is above. It does not carry ffmpeg. What it carries beyond that list is the open question this
  # job exists to answer, which is why its first real step is a probe.
  #
  # continue-on-error WHILE THIS IS BEING MEASURED, and that is a decision rather than an oversight.
  # Nobody here has run anything on this image, and a red branch caused by a tool the image happens
  # not to ship reads as broken code - which is the one thing a red must never mean. It starts
  # blocking once there is an answer to block on.
  #
  # It does not run verify.ps1 and it does not run the whole suite. Arm64PlaybackTests lives in
  # MediaTests and, on an ARM64 host, refuses any phase that is not Passed: running it in this pass
  # would guarantee a red before anything had been measured.
  arm64-matrix:
    runs-on: windows-11-arm
    continue-on-error: true
    # The x64 job's 90 minutes are its own; a job carries its own clock, so this one cannot eat into
    # the margin eng/measure-ci-time.ps1 reports. Sixty was a first guess on a 4-core machine and the
    # first native run answered it: nine minutes end to end, six of them in the packaging step. Thirty
    # leaves more than triple the margin and makes a hang announce itself in half an hour rather than
    # in one. The number to watch is the healthy job, as above: if it approaches thirty, the work has
    # grown rather than the ceiling being wrong.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # No cache on purpose: one fewer unknown on a runner that has never been used here.
          dotnet-version: 10.0.302
      # THE POINT OF THE FIRST RUN. Everything downstream can fail for reasons that belong to the
      # image rather than to the code, so what the image actually carries is recorded before any of
      # it is exercised, and it is recorded whether or not the rest gets that far.
      - name: Probe what this image carries
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $probe = [System.Collections.Generic.List[string]]::new()
          $probe.Add("Image:                $env:ImageOS $env:ImageVersion")
          $probe.Add("OS description:       $([Runtime.InteropServices.RuntimeInformation]::OSDescription)")
          $probe.Add("OS architecture:      $([Runtime.InteropServices.RuntimeInformation]::OSArchitecture)")
          $probe.Add("Process architecture: $([Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture)")
          $probe.Add("PowerShell:           $($PSVersionTable.PSVersion)")
          $probe.Add('')
          $probe.Add('dotnet --list-sdks:')
          foreach ($line in (dotnet --list-sdks 2>&1)) { $probe.Add("  $line") }
          $probe.Add('')
          $choco = Get-Command choco -ErrorAction SilentlyContinue
          $probe.Add("choco:  $(if ($choco) { ((choco --version 2>&1) -join ' ') } else { 'NOT PRESENT' })")
          $ffmpeg = Get-Command ffmpeg -ErrorAction SilentlyContinue
          $probe.Add("ffmpeg: $(if ($ffmpeg) { $ffmpeg.Source } else { 'NOT PRESENT' })")
          $probe.Add('')
          # eng/find-sdk-tool.ps1 looks under the SDK's `x64` folder only. On this host that either
          # works through emulation or does not work at all, and which one decides whether the
          # package can be sealed here. Widening it before knowing would be guessing.
          $probe.Add('Windows SDK bin folders carrying makeappx.exe:')
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          if (Test-Path -LiteralPath $kits) {
            $found = Get-ChildItem -LiteralPath $kits -Directory -ErrorAction SilentlyContinue |
              ForEach-Object { Get-ChildItem -LiteralPath $_.FullName -Directory -ErrorAction SilentlyContinue } |
              Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'makeappx.exe') }
            if ($found) { foreach ($folder in $found) { $probe.Add("  $($folder.FullName)") } }
            else { $probe.Add('  none') }
          }
          else {
            $probe.Add("  $kits does not exist")
          }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $probe | Tee-Object -FilePath artifacts/arm64-probe.txt
      # Same pinned version and same three attempts as the x64 job, and one deliberate difference: it
      # does not throw. On this host Chocolatey installs the x64 build and Windows runs it emulated,
      # which is fine for PRODUCING the samples - ffmpeg is not the code under test - but it is
      # written into the evidence rather than left implicit. If it cannot be installed at all, the
      # media phases now say they could not measure instead of passing without measuring.
      - name: Install ffmpeg
        continue-on-error: true
        shell: pwsh
        run: |
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { 'ffmpeg is already present.'; exit 0 }
          foreach ($attempt in 1..3) {
            choco install ffmpeg --version 9.0.0 -y --no-progress
            if ($LASTEXITCODE -eq 0) { exit 0 }
            "Attempt $attempt failed ($LASTEXITCODE); the community feed is the usual reason."
            if ($attempt -lt 3) { Start-Sleep -Seconds (20 * $attempt) }
          }
          'ffmpeg could not be installed; the media phases will report that they could not measure.'
      # verify.ps1 is what normally produces these and this job does not run it, so it asks directly.
      # Without them CodecMatrixTests and HdrAccelerationTests skip themselves.
      - name: Generate the media samples
        continue-on-error: true
        shell: pwsh
        run: ./eng/generate-test-media.ps1 -Output artifacts/test-media
      - name: Build the ARM64 package and run its matrix
        shell: pwsh
        run: ./eng/package-arm64.ps1 -Configuration Release
      # A name of its own: the x64 job already publishes `arm64-matrix`, which is the same file
      # answered from the wrong side of the question.
      - name: Upload the natively measured ARM64 matrix
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arm64-matrix-native
          path: |
            artifacts/arm64-probe.txt
            artifacts/package-arm64/arm64-matrix.json
            artifacts/package-arm64/contents.json
            artifacts/package-arm64/lifecycle.json
            artifacts/package-arm64/matrix/**/*.trx
          if-no-files-found: warn
