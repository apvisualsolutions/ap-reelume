# CI-004/SEC-006: the workflows pin every action by commit SHA, so a compromised tag can no
# longer move what CI runs. Dependabot is the half that keeps the pins from fossilising: it opens
# a pull request when an action publishes a new release, and the pin only moves by review.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # NuGet packages are centrally pinned and restored in locked mode, and NuGetAudit fails the build
  # on a moderate advisory. That guards the day an advisory lands; it does nothing for the months
  # before one, where the repository simply sits on an old version. Dependabot is the other half:
  # it proposes the move, and the lock files travel in the same pull request, so a version only
  # changes with a green verification behind it.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Avalonia's packages move as a set; separate pull requests would each fail against the
      # others' pinned versions.
      avalonia:
        patterns:
          - "Avalonia*"
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.collector"
          - "NSubstitute"
          - "FsCheck"
          - "FlaUI*"
